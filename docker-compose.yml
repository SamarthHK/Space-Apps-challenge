services:
  postgis:
    image: postgis/postgis:17-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set the dedicated acceptance database}
      POSTGRES_USER: ${POSTGRES_USER:?Set the dedicated acceptance role}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Provide the password through the environment}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55439}:5432"
    volumes:
      - acceptance_postgis:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  acceptance_postgis:
