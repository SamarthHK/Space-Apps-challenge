project:
  name: "Agriculture Data Collection & Processing Platform"
  version: "0.1.0"
  region: "Karnataka, India"
  description: "Automated KML-based agricultural data acquisition, processing, PostGIS storage, and multi-domain analysis."

input:
  default_kml_path: "data/input/farm_area.kml"
  supported_formats:
    - ".kml"
    - ".kmz"
    - ".geojson"
    - ".gpkg"

coordinates:
  storage_crs: "EPSG:4326"
  equal_area_crs: "EPSG:6933"
  auto_utm: true

buffers_meters:
  field_boundary: 0
  immediate_surroundings: 100
  water_and_drainage: 500
  local_environmental: 1000
  landscape_hydrological: 5000
  regional_stations: 10000

paths:
  raw_data_dir: "data/raw"
  staging_dir: "data/staging"
  normalized_dir: "data/normalized"
  processed_dir: "data/processed"
  derived_dir: "data/derived"
  exports_dir: "data/exports"
  cache_dir: "data/cache"
  logs_dir: "logs"

storage:
  preferred_backend: "sqlite"  # Can be "postgresql" or "sqlite"
  sqlite_path: "data/agri_data.db"
  save_raw: true
  save_processed_parquet: true
  save_derived_parquet: true
  export_geojson: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/agri_platform.log"
