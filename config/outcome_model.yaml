    latitude: 51.99906
    longitude: -0.61673
    reference: https://www.era.rothamsted.ac.uk/experiment/wrn3
  broadbalk:
    latitude: 51.80946
    longitude: -0.37301
    reference: https://www.era.rothamsted.ac.uk/experiment/rbk1
