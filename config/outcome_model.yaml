schema_version: "1"
task: retrospective_preplant_crop_outcome
weather:
  start: "1981-01-01"
  end: "2022-12-31"
  time_standard: LST
  windows_days: [30, 90, 365]
  minimum_coverage: 0.9
evaluation:
  train_fraction: 0.70
  validation_fraction: 0.15
  minimum_years: 5
  minimum_training_rows: 40
  iterations: 400
  depth: 5
  learning_rate: 0.05
  seed: 42
  threads: 2
policy:
  scientific_approval_required: false
  cutoff: day_before_recorded_sowing
  historical_availability: retrospective_source_reconstruction_not_archived_operational_forecasts
  geography: represented_experiment_sites_only
  future_weather: forbidden
  fabricated_observations: forbidden
  missing_numeric_inputs: native_model_missingness_not_imputation
  cross_crop_raw_yield_ranking: forbidden
sites:
