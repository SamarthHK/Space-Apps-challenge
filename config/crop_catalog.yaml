rotation_compatibility:
  pairs:
    - previous: "pigeonpea"
      next: "ragi"
      compatibility_score: 9.2
      benefit_notes: "Legume fixes N (60-85 kg/ha), low C:N residue decomposes rapidly, disrupts cereal blast and foot rot cycle."
      expected_yield_delta_pct: 14.5
    - previous: "groundnut"
      next: "ragi"
      compatibility_score: 9.0
      benefit_notes: "Residual nitrogen from groundnut enhances ragi vegetative vigor and tillering."
      expected_yield_delta_pct: 12.0
    - previous: "groundnut"
      next: "maize"
      compatibility_score: 8.8
      benefit_notes: "Maize thrives on residual soil organic N and improved soil aeration from groundnut digging."
      expected_yield_delta_pct: 15.0
    - previous: "sugarcane"
      next: "pigeonpea"
      compatibility_score: 8.5
      benefit_notes: "Breaks monoculture soil compaction, restructures rhizosphere, rebuilds soil nitrogen."
      expected_yield_delta_pct: 10.0
    - previous: "maize"
      next: "ragi"
      compatibility_score: 4.5
      benefit_notes: "Consecutive high-demand Poaceae cereals lead to severe N and K mining without adequate fertilisation."
      expected_yield_delta_pct: -8.0
    - previous: "ragi"
      next: "ragi"
      compatibility_score: 5.0
      benefit_notes: "Continuous ragi cropping increases blast (Magnaporthe grisea) spore load in topsoil."
      expected_yield_delta_pct: -6.5
