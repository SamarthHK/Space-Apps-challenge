variables:
  # 1. Soil Properties
  soil_ph:
    category: "soil"
    description: "Soil acidity or alkalinity in H2O"
    canonical_unit: "pH"
    valid_range: [2.5, 11.0]
    measurement_types: ["measured", "modelled"]
    depth_dependent: true

  sand_content:
    category: "soil"
    description: "Sand particle fraction (0.05-2.0 mm)"
    canonical_unit: "%"
    valid_range: [0.0, 100.0]
    measurement_types: ["measured", "modelled"]
    depth_dependent: true

  silt_content:
    category: "soil"
    description: "Silt particle fraction (0.002-0.05 mm)"
    canonical_unit: "%"
    valid_range: [0.0, 100.0]
    measurement_types: ["measured", "modelled"]
    depth_dependent: true

  clay_content:
    category: "soil"
    description: "Clay particle fraction (<0.002 mm)"
    canonical_unit: "%"
    valid_range: [0.0, 100.0]
    measurement_types: ["measured", "modelled"]
    depth_dependent: true

  organic_carbon:
    category: "soil"
    description: "Soil organic carbon content"
    canonical_unit: "g/kg"
    valid_range: [0.0, 200.0]
    measurement_types: ["measured", "modelled"]
    depth_dependent: true

  total_nitrogen:
    category: "soil"
    description: "Total nitrogen in soil"
    canonical_unit: "g/kg"
    valid_range: [0.0, 50.0]
    measurement_types: ["measured", "modelled"]
    depth_dependent: true

  bulk_density:
    category: "soil"
    description: "Dry bulk density of the fine earth fraction"
    canonical_unit: "g/cm3"
    valid_range: [0.5, 2.5]
    measurement_types: ["measured", "modelled"]
    depth_dependent: true

  cation_exchange_capacity:
    category: "soil"
    description: "Cation exchange capacity at pH 7"
    canonical_unit: "cmolc/kg"
    valid_range: [0.0, 150.0]
    measurement_types: ["measured", "modelled"]
    depth_dependent: true

  coarse_fragments:
    category: "soil"
    description: "Volumetric fraction of coarse rock fragments (>2 mm)"
    canonical_unit: "%"
    valid_range: [0.0, 100.0]
    measurement_types: ["measured", "modelled"]
    depth_dependent: true

  electrical_conductivity:
    category: "soil"
    description: "Soil salinity as electrical conductivity (1:2 or saturated paste)"
    canonical_unit: "dS/m"
    valid_range: [0.0, 50.0]
    measurement_types: ["measured"]
    depth_dependent: true

  available_water_capacity:
    category: "soil"
    description: "Plant available water capacity between field capacity and wilting point"
    canonical_unit: "mm/m"
    valid_range: [0.0, 400.0]
    measurement_types: ["derived", "modelled"]
    depth_dependent: true

  # 2. Terrain & Topography
  elevation:
    category: "terrain"
    description: "Altitude above sea level"
    canonical_unit: "m"
    valid_range: [-500.0, 9000.0]
    measurement_types: ["satellite", "measured"]
    depth_dependent: false

  slope:
    category: "terrain"
    description: "Ground surface inclination"
    canonical_unit: "degrees"
    valid_range: [0.0, 90.0]
    measurement_types: ["derived"]
    depth_dependent: false

  aspect:
    category: "terrain"
    description: "Compass direction faced by the slope"
    canonical_unit: "degrees"
    valid_range: [0.0, 360.0]
    measurement_types: ["derived"]
    depth_dependent: false

  topographic_wetness_index:
    category: "terrain"
    description: "Topographic wetness index (ln(a / tan(beta)))"
    canonical_unit: "dimensionless"
    valid_range: [0.0, 35.0]
    measurement_types: ["derived"]
    depth_dependent: false

  # 3. Climate & Atmospheric
  daily_rainfall:
    category: "climate"
    description: "Total daily precipitation depth"
    canonical_unit: "mm"
    valid_range: [0.0, 1000.0]
    measurement_types: ["measured", "satellite", "reanalysis"]
    depth_dependent: false

  temperature_mean:
    category: "climate"
    description: "Daily mean 2-metre air temperature"
    canonical_unit: "degC"
    valid_range: [-60.0, 60.0]
    measurement_types: ["measured", "reanalysis"]
    depth_dependent: false

  temperature_max:
    category: "climate"
    description: "Daily maximum 2-metre air temperature"
    canonical_unit: "degC"
    valid_range: [-50.0, 65.0]
    measurement_types: ["measured", "reanalysis"]
    depth_dependent: false

  temperature_min:
    category: "climate"
    description: "Daily minimum 2-metre air temperature"
    canonical_unit: "degC"
    valid_range: [-70.0, 50.0]
    measurement_types: ["measured", "reanalysis"]
    depth_dependent: false

  relative_humidity:
    category: "climate"
    description: "Daily mean relative humidity at 2 m"
    canonical_unit: "%"
    valid_range: [0.0, 100.0]
    measurement_types: ["measured", "reanalysis"]
    depth_dependent: false

  solar_radiation:
    category: "climate"
    description: "All-sky insolation incident on a horizontal surface"
    canonical_unit: "MJ/m2/day"
    valid_range: [0.0, 45.0]
    measurement_types: ["satellite", "reanalysis"]
    depth_dependent: false

  wind_speed:
    category: "climate"
    description: "Mean wind speed at 2 m height"
    canonical_unit: "m/s"
    valid_range: [0.0, 75.0]
    measurement_types: ["measured", "reanalysis"]
    depth_dependent: false

  growing_degree_days:
    category: "climate"
    description: "Accumulated thermal time base temperature 10C"
    canonical_unit: "degC-day"
    valid_range: [0.0, 5000.0]
    measurement_types: ["derived"]
    depth_dependent: false

  reference_et0:
    category: "climate"
    description: "FAO-56 Penman-Monteith reference crop evapotranspiration"
    canonical_unit: "mm/day"
    valid_range: [0.0, 20.0]
    measurement_types: ["derived"]
    depth_dependent: false

  # 4. Water Resources
  groundwater_depth:
    category: "water"
    description: "Depth to groundwater water table below surface"
    canonical_unit: "m bgl"
    valid_range: [0.0, 300.0]
    measurement_types: ["measured"]
    depth_dependent: false

  surface_soil_moisture:
    category: "water"
    description: "Volumetric soil moisture (0-5 cm)"
    canonical_unit: "m3/m3"
    valid_range: [0.0, 0.7]
    measurement_types: ["satellite", "sensor", "reanalysis"]
    depth_dependent: true

  root_zone_soil_moisture:
    category: "water"
    description: "Volumetric soil moisture across root zone"
    canonical_unit: "m3/m3"
    valid_range: [0.0, 0.7]
    measurement_types: ["modelled", "reanalysis"]
    depth_dependent: true

  # 5. Historical Land & Vegetation
  ndvi:
    category: "vegetation"
    description: "Normalized Difference Vegetation Index"
    canonical_unit: "dimensionless"
    valid_range: [-1.0, 1.0]
    measurement_types: ["satellite", "derived"]
    depth_dependent: false

  ndmi:
    category: "vegetation"
    description: "Normalized Difference Moisture Index"
    canonical_unit: "dimensionless"
    valid_range: [-1.0, 1.0]
    measurement_types: ["satellite", "derived"]
    depth_dependent: false

  savi:
    category: "vegetation"
    description: "Soil Adjusted Vegetation Index (L=0.5)"
    canonical_unit: "dimensionless"
    valid_range: [-1.0, 1.0]
    measurement_types: ["satellite", "derived"]
    depth_dependent: false

  lai:
    category: "vegetation"
    description: "Leaf Area Index"
    canonical_unit: "m2/m2"
    valid_range: [0.0, 12.0]
    measurement_types: ["satellite", "modelled", "measured"]
    depth_dependent: false

  # 6. Crop Performance & Yield
  crop_yield:
    category: "performance"
    description: "Harvested economic yield per unit area"
    canonical_unit: "kg/ha"
    valid_range: [0.0, 200000.0]
    measurement_types: ["measured", "surveyed", "simulated"]
    depth_dependent: false

  biomass_yield:
    category: "performance"
    description: "Total dry aboveground biomass per hectare"
    canonical_unit: "kg/ha"
    valid_range: [0.0, 300000.0]
    measurement_types: ["measured", "simulated"]
    depth_dependent: false

  # 7. Rotation & Nutrient Cycling
  nitrogen_fixation:
    category: "rotation"
    description: "Atmospheric nitrogen fixed by legume crops"
    canonical_unit: "kg N/ha"
    valid_range: [0.0, 450.0]
    measurement_types: ["modelled", "measured"]
    depth_dependent: false

  crop_residue_biomass:
    category: "rotation"
    description: "Dry crop residue remaining post harvest"
    canonical_unit: "kg/ha"
    valid_range: [0.0, 30000.0]
    measurement_types: ["modelled", "measured"]
    depth_dependent: false
