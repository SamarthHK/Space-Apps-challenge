processing:
  zonal_statistics:
    default_stats:
      - "mean"
      - "median"
      - "min"
      - "max"
      - "std"
      - "p10"
      - "p90"
      - "valid_pixel_count"
      - "coverage_percentage"
    all_touched: true
    nodata_value: -9999

  vegetation_indices:
    supported:
      ndvi:
        formula: "(nir - red) / (nir + red)"
        range: [-1.0, 1.0]
      ndmi:
        formula: "(nir - swir1) / (nir + swir1)"
        range: [-1.0, 1.0]
      savi:
        formula: "((nir - red) / (nir + red + 0.5)) * 1.5"
        range: [-1.0, 1.0]
      evi:
        formula: "2.5 * ((nir - red) / (nir + 6.0 * red - 7.5 * blue + 1.0))"
        range: [-1.0, 1.0]
    cloud_mask_threshold: 0.20

  climate_indicators:
    dry_spell_threshold_mm: 2.5
    heavy_rain_threshold_mm: 50.0
    heatwave_temp_c: 40.0
    base_temperature_gdd: 10.0
    spi_scales: [1, 3, 6, 12] # months

  soil_quality_control:
    depth_layers_cm:
      - "0-5"
      - "5-15"
      - "15-30"
      - "30-60"
      - "60-100"
      - "100-200"
    check_particle_sum: true  # sand + silt + clay should be ~100%

  cache_policy:
    enabled: true
    ttl_days: 30
    hash_algorithm: "sha256"
