x-backend: &backend
  build:
    context: ./backend
  image: bhumi-backend:local
  environment: &backend-environment
    APP_HOST: ${APP_HOST:-127.0.0.1}
    API_PORT: ${API_PORT:-8080}
    FRONTEND_PORT: ${FRONTEND_PORT:-1080}
    POSTGRES_DB: ${POSTGRES_DB:-bhumi}
    POSTGRES_USER: ${POSTGRES_USER:-bhumi}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your ignored .env}
    DB_HOST: db
    DB_PORT: "5432"
    CANONICAL_SCHEMA: ${CANONICAL_SCHEMA:-agri_bhumi_data}
    WORKSPACE_SCHEMA: ${WORKSPACE_SCHEMA:-agri_bhumi_workspace}
    DEPLOYMENT_ID: ${DEPLOYMENT_ID:-bhumi}
    AUTH_SESSION_SECONDS: ${AUTH_SESSION_SECONDS:-43200}

services:
  db:
    build:
      context: ./database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bhumi}
      POSTGRES_USER: ${POSTGRES_USER:-bhumi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your ignored .env}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  init:
    <<: *backend
    command: ["init"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: ["api", "--container"]
    ports:
      - "${APP_HOST:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "agri_data.deployment", "check", "api", "--container"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["worker"]
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "agri_data.deployment", "check", "worker"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://${APP_HOST:-127.0.0.1}:${API_PORT:-8080}"
    ports:
      - "${APP_HOST:-127.0.0.1}:${FRONTEND_PORT:-1080}:80"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  postgis_data:
